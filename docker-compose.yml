services:
  krolikov:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krolikov
    env_file:
      - .env
    environment:
      ANALYTICS_SERVICE_URL: http://analytics:8000
    ports:
      - "3000:80"
    depends_on:
      analytics:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-krolikov}:${POSTGRES_PASSWORD:-krolikov}@db:5432/${POSTGRES_DB:-krolikov}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krolikov}
      POSTGRES_USER: ${POSTGRES_USER:-krolikov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krolikov}
    volumes:
      - krolikov-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  krolikov-postgres:
